<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8a33d'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 口袋 · 在线版（本地处理，不上传）</title>
<style>
  :root{--bg:#0b0e14;--card:#131922;--line:#212c3a;--txt:#e8eef7;--dim:#8b9bb4;--amber:#e8a33d;--amber-d:#231703}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--amber);color:var(--amber-d);display:grid;place-items:center;font-weight:800}
  h1{font-size:17px;margin:0}
  .sub{color:var(--dim);font-size:12.5px}
  main{max-width:880px;margin:0 auto;padding:22px}
  .drop{border:1.5px dashed var(--line);border-radius:16px;padding:34px;text-align:center;background:#0f141c;cursor:pointer}
  .drop.over{border-color:var(--amber);background:#151c26}
  .btn{background:var(--amber);color:var(--amber-d);border:0;border-radius:11px;padding:10px 18px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .files{margin:14px 0;display:grid;gap:8px}
  .file{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
  .file .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file .meta{color:var(--dim);font-size:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
  input[type=text],input[type=number],select{background:#0d131b;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 10px;font-size:14px}
  .tabs{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
  .tab{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
  .tab.on{background:var(--amber);color:var(--amber-d);border-color:var(--amber);font-weight:700}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#0d131b;border-top:1px solid var(--line);padding:10px 22px;display:flex;justify-content:space-between;align-items:center}
  .hint{color:var(--dim);font-size:12.5px}
  #toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1b2432;border:1px solid var(--line);padding:9px 16px;border-radius:10px;font-size:13.5px}
  .opt{display:none}
  .opt.on{display:block}
  footer.tip{padding:26px 0 90px;color:var(--dim);font-size:12.5px;text-align:center}
  a{color:var(--amber)}
</style>
</head>
<body>
<header>
  <div class="logo">PDF</div>
  <div style="flex:1"><h1 data-t="title">PDF 口袋 · 在线版</h1><div class="sub" data-t="sub">所有处理在本机完成，文件不会离开你的电脑。</div></div>
  <button class="btn ghost" id="langBtn" style="padding:6px 12px;font-size:13px">EN</button>
</header>

<main>
  <div class="tabs" id="tabs">
    <button class="tab on" data-mode="merge" data-t="merge">合并</button>
    <button class="tab" data-mode="split" data-t="split">拆分</button>
    <button class="tab" data-mode="rotate" data-t="rotate">旋转</button>
    <button class="tab" data-mode="compress" data-t="compress">压缩</button>
    <button class="tab" data-mode="img" data-t="img">图片转 PDF</button>
  </div>

  <div class="drop" id="drop">
    <p style="margin:0 0 6px" data-t="drop">把 PDF 或图片拖进来，或点这里选择</p>
    <div class="hint"><span data-t="dropSub">支持多选 · 不上传 · 断网也能用 · </span><a href="#" id="demoLink" data-t="demo">用样例文件试试</a></div>
    <input id="fileInput" type="file" accept="application/pdf,.pdf,image/jpeg,image/png,.jpg,.jpeg,.png" multiple hidden>
  </div>

  <div class="files" id="files"></div>

  <div class="opt on" id="opt-merge">
    <div class="row"><span class="hint" data-t="mergeHint">按列表顺序合并；拖拽排序请在扩展版里用 ↑↓</span></div>
  </div>
  <div class="opt" id="opt-split">
    <div class="row">
      <label><input type="radio" name="sm" value="every" checked> 每 N 页切一份</label>
      <input type="number" id="splitN" value="1" min="1" style="width:80px">
      <label><input type="radio" name="sm" value="range"> 只取这些页</label>
      <input type="text" id="splitRange" placeholder="1-3,5" style="width:140px">
    </div>
  </div>
  <div class="opt" id="opt-rotate">
    <div class="row">
      <label><input type="radio" name="rm" value="all" checked> 整份</label>
      <label><input type="radio" name="rm" value="range"> 只转这几页</label>
      <input type="text" id="rotateRange" placeholder="1-3,5" style="width:130px">
      <select id="rotateDeg"><option value="90">顺时针 90°</option><option value="180">180°</option><option value="270">顺时针 270°</option></select>
    </div>
  </div>
  <div class="opt" id="opt-img">
    <div class="row"><span class="hint" data-t="imgHint">每张图一页 A4，等比缩放居中，留 24pt 边距。支持 JPG / PNG。</span></div>
  </div>
  <div class="opt" id="opt-compress">
    <div class="row">
      <span class="hint" data-t="compHint">重压缩内嵌图片，文字与矢量保持清晰</span>
      <select id="level"><option value="light">轻（2200px）</option><option value="normal" selected>标准（1600px）</option><option value="strong">强（1100px）</option></select>
    </div>
  </div>

  <footer class="tip"><span data-t="tipA">想要批量拆分、加水印、发票拼版？</span><a href="../" data-t="tipB">装浏览器扩展版（Pro）</a></footer>
</main>

<div class="bar">
  <span class="hint" id="summary" data-t="noFiles">还没有文件</span>
  <button class="btn" id="runBtn" disabled data-t="run">开始处理</button>
</div>
<div id="toast" hidden></div>

<script type="module">
import { merge, extract, splitEvery, rotate, info } from "./core.js";

const $ = (s) => document.querySelector(s);

const DICT = {
  zh: {title:"PDF 口袋 · 在线版", sub:"所有处理在本机完成，文件不会离开你的电脑。", merge:"合并", split:"拆分",
        rotate:"旋转", compress:"压缩", img:"图片转 PDF", drop:"把 PDF 或图片拖进来，或点这里选择",
        dropSub:"支持多选 · 不上传 · 断网也能用 · ", demo:"用样例文件试试", noFiles:"还没有文件", run:"开始处理",
        tipA:"想要批量拆分、加水印、发票拼版？ ", tipB:"装浏览器扩展版（Pro）", working:"处理中…",
        merged:"合并并下载", splitBtn:"拆分并下载", rotBtn:"旋转并下载", compBtn:"压缩并下载", imgBtn:"转成 PDF",
        added:"已加入样例.pdf（3 页）", fail:"处理失败：", noImg:"先加几张图片", demoFail:"样例加载失败：",
        splitOne:"份，在线版只下载第一份；批量导出请用扩展版", badRange:"页码写错了", unit:" 个文件 · ",
        mergeHint:"按列表顺序合并；拖拽排序请在扩展版里用 ↑↓", splitHint:"每 N 页切一份，或只取指定页（1-3,5）", imgHint:"每张图一页 A4，等比缩放居中，最多 5 张", compHint:"重压缩内嵌图片，文字与矢量保持清晰"},
  en: {title:"PDF Pocket · Web", sub:"Everything runs on your machine. Your files never leave your computer.", merge:"Merge",
        split:"Split", rotate:"Rotate", compress:"Compress", img:"Images to PDF", drop:"Drop PDFs or images here, or click to choose",
        dropSub:"Multiple files · no upload · works offline · ", demo:"try a sample file", noFiles:"No files yet", run:"Run",
        tipA:"Need batch split, watermark, invoice sheets? ", tipB:"get the extension (Pro)", working:"Working…",
        merged:"Merge & download", splitBtn:"Split & download", rotBtn:"Rotate & download", compBtn:"Compress & download", imgBtn:"Convert to PDF",
        added:"sample.pdf added (3 pages)", fail:"Failed: ", noImg:"add some images first", demoFail:"Sample failed: ",
        splitOne:" parts — web version downloads the first only; batch export is in the extension", badRange:"bad page range", unit:" files · ",
        mergeHint:"Files merge in list order. Reordering with ↑↓ is in the extension.", splitHint:"Split every N pages, or take specific pages (1-3,5)", imgHint:"One A4 page per image, scaled to fit. Max 5 images.", compHint:"Re-compresses embedded images; text and vectors stay crisp."}
};
let LANG = (navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh" : "en";
const T = (k) => (DICT[LANG][k] != null ? DICT[LANG][k] : DICT.zh[k] || k);
function applyLang() {
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.title = T("title");
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T(el.dataset.t); });
  document.querySelector("#langBtn").textContent = LANG === "zh" ? "EN" : "中文";
  paint();
}
document.querySelector("#langBtn").addEventListener("click", () => { LANG = LANG === "zh" ? "en" : "zh"; applyLang(); });

const state = { mode: "merge", files: [] };

const drop = $("#drop"), input = $("#fileInput");
drop.addEventListener("click", () => input.click());
input.addEventListener("change", (e) => { add([...e.target.files]); input.value = ""; });
["dragenter","dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => add([...e.dataTransfer.files]));

$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.mode = b.dataset.mode;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t === b));
  document.querySelectorAll(".opt").forEach((o) => o.classList.toggle("on", o.id === "opt-" + state.mode));
  document.querySelector("#demoLink").addEventListener("click", async (e) => {
  e.preventDefault(); e.stopPropagation();
  try {
    const r = await fetch("./demo.pdf");
    const buf = new Uint8Array(await r.arrayBuffer());
    const meta = await info(buf);
    state.files.push({ name: "样例.pdf", size: buf.length, pages: meta.pages, buf });
    paint(); toast(T("added"));
  } catch (err) { toast(T("demoFail") + (err.message || err)); }
});

paint();
});

async function add(list) {
  const imgs = list.filter((f) => /^image\/(jpeg|png)$/i.test(f.type) || /\.(jpe?g|png)$/i.test(f.name));
  if (imgs.length) {
    for (const f of imgs) {
      const bytes = new Uint8Array(await f.arrayBuffer());
      state.files.push({ name: f.name, size: f.size, pages: 1, buf: bytes, kind: "image", type: f.type });
    }
    if (state.mode !== "img") { state.mode = "img"; document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.mode==="img")); document.querySelectorAll(".opt").forEach(o=>o.classList.toggle("on", o.id==="opt-img")); }
  }
  for (const f of list.filter((f) => /\.pdf$/i.test(f.name))) {
    try {
      const buf = new Uint8Array(await f.arrayBuffer());
      const meta = await info(buf);
      state.files.push({ name: f.name, size: f.size, pages: meta.pages, buf });
    } catch (err) { toast("读不了这个文件：" + (err.message || err)); }
  }
  document.querySelector("#demoLink").addEventListener("click", async (e) => {
  e.preventDefault(); e.stopPropagation();
  try {
    const r = await fetch("./demo.pdf");
    const buf = new Uint8Array(await r.arrayBuffer());
    const meta = await info(buf);
    state.files.push({ name: "样例.pdf", size: buf.length, pages: meta.pages, buf });
    paint(); toast(T("added"));
  } catch (err) { toast(T("demoFail") + (err.message || err)); }
});

paint();
}

function human(b) { return b > 1048576 ? (b/1048576).toFixed(1)+" MB" : b > 1024 ? Math.round(b/1024)+" KB" : b+" B"; }

function paint() {
  $("#files").innerHTML = state.files.map((f, i) =>
    `<div class="file"><span>${i+1}</span><span class="n">${f.name}</span>
     <span class="meta">${f.pages} 页 · ${human(f.size)}</span>
     <button class="btn ghost" data-x="${i}" style="padding:4px 9px">×</button></div>`).join("");
  document.querySelectorAll("[data-x]").forEach((b) => b.onclick = () => { state.files.splice(+b.dataset.x, 1); document.querySelector("#demoLink").addEventListener("click", async (e) => {
  e.preventDefault(); e.stopPropagation();
  try {
    const r = await fetch("./demo.pdf");
    const buf = new Uint8Array(await r.arrayBuffer());
    const meta = await info(buf);
    state.files.push({ name: "样例.pdf", size: buf.length, pages: meta.pages, buf });
    paint(); toast(T("added"));
  } catch (err) { toast(T("demoFail") + (err.message || err)); }
});

paint(); });
  const pages = state.files.reduce((a, f) => a + f.pages, 0);
  const size = state.files.reduce((a, f) => a + f.size, 0);
  $("#summary").textContent = state.files.length
    ? (LANG === "zh"
        ? `${state.files.length} 个文件 · ${pages} 页 · ${human(size)}`
        : `${state.files.length} file${state.files.length > 1 ? "s" : ""} · ${pages} page${pages > 1 ? "s" : ""} · ${human(size)}`)
    : T("noFiles");
  $("#runBtn").disabled = !state.files.length;
  $("#runBtn").textContent = { merge: T("merged"), split: T("splitBtn"), rotate: T("rotBtn"), compress: T("compBtn"), img: T("imgBtn") }[state.mode];
}

function download(bytes, name) {
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

let tt;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 4200);
}

$("#runBtn").addEventListener("click", async () => {
  const btn = $("#runBtn"); btn.disabled = true; const old = btn.textContent; btn.textContent = T("working");
  try {
    if (state.mode === "merge") {
      download(await merge(state.files.map((f) => f.buf)), "merged.pdf");
    } else if (state.mode === "split") {
      const mode = document.querySelector('input[name="sm"]:checked').value;
      if (mode === "range") download(await extract(state.files[0].buf, $("#splitRange").value.trim()), "extracted.pdf");
      else {
        const parts = await splitEvery(state.files[0].buf, Math.max(1, +$("#splitN").value || 1));
        download(parts[0].bytes, parts[0].name);
        if (parts.length > 1) toast(`${parts.length}${T("splitOne")}`);
      }
    } else if (state.mode === "rotate") {
      const scope = document.querySelector('input[name="rm"]:checked').value;
      download(await rotate(state.files[0].buf, scope === "range" ? $("#rotateRange").value.trim() : "", +$("#rotateDeg").value), "rotated.pdf");
    } else if (state.mode === "img") {
      const { imagesToPdf } = await import("./core.js");
      const items = state.files.filter((f) => f.kind === "image").map((f) => ({ bytes: f.buf, type: f.type, name: f.name }));
      if (!items.length) throw new Error(T("noImg"));
      download(await imagesToPdf(items), "images.pdf");
    } else {
      const { compress } = await import("./compress.js");
      const before = state.files[0].buf.byteLength;
      const bytes = await compress(state.files[0].buf, $("#level").value);
      download(bytes, "compressed.pdf");
      toast(`${human(before)} → ${human(bytes.length)}`);
    }
  } catch (e) {
    toast(T("fail") + (e.message === "empty-range" ? T("badRange") : e.message || e));
  } finally { btn.disabled = !state.files.length; btn.textContent = old; paint(); }
});

$("#demoLink").addEventListener("click", async (e) => {
  e.preventDefault(); e.stopPropagation();
  try {
    const r = await fetch("./demo.pdf");
    const buf = new Uint8Array(await r.arrayBuffer());
    const meta = await info(buf);
    state.files.push({ name: "样例.pdf", size: buf.length, pages: meta.pages, buf });
    paint(); toast(T("added"));
  } catch (err) { toast(T("demoFail") + (err.message || err)); }
});

applyLang();
</script>
</body>
</html>
